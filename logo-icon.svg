<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="20" y1="24" x2="48" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0D9488" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Protective Shield + Droplet Contour -->
  <path d="M32 6 C23 16 14 26 14 37 C14 47.5 22 56 32 58 C42 56 50 47.5 50 37 C50 26 41 16 32 6 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#glow)"/>

  <!-- Inner Dynamic Fluid Wave / Droplet Highlight -->
  <path d="M32 12 C25 20 18 28.5 18 37 C18 44.5 24.2 51.5 32 53.5 C30 50 24 43 24 36 C24 28 30 20 32 12 Z" 
        fill="#5EEAD4" 
        opacity="0.35"/>

  <!-- Compliance Shield Checkmark -->
  <path d="M22 36 L28.5 42.5 L43 26" 
        stroke="#FFFFFF" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Floating Precision Droplet Accent -->
  <circle cx="43.5" cy="18.5" r="2.5" fill="#34D399"/>
</svg>
